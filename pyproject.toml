[project]
name = "vidtoolz-jitter"
version = "0.1.0"
description = "Add jitter effect to a video using moviepy"
readme = "README.md"
authors = [{ name = "Sukhbinder Singh" }]
license = { text = "Apache-2.0" }
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = ["vidtoolz"]

[project.urls]
Homepage = "https://github.com/sukhbinder/vidtoolz-jitter"
Changelog = "https://github.com/sukhbinder/vidtoolz-jitter/releases"
Issues = "https://github.com/sukhbinder/vidtoolz-jitter/issues"
CI = "https://github.com/sukhbinder/vidtoolz-jitter/actions"

[project.entry-points."vidtoolz_plugins"]
jitter = "vidtoolz_jitter:jitter_plugin"


[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
